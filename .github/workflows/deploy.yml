name: Deploy to GitHub Pages

# Build the self-contained apps with tools/build.mjs and publish the dist/
# folder as a Pages artifact. This uses the "GitHub Actions" Pages source, which
# can serve any folder — unlike "Deploy from a branch", which is limited to the
# repo root or /docs.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token that still lets the Pages deployment run.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push cancel an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The build has no dependencies, so there is nothing to install.
      - name: Build apps and portal
        run: node tools/build.mjs

      # Belt and suspenders: skip any Jekyll processing of the artifact.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
