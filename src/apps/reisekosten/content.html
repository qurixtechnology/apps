<div class="rk">

  <!-- Kopfzeile: Titel + globale Aktionen -->
  <div class="rk-topbar">
    <div class="rk-topbar-titles">
      <h1 class="rk-title" data-qrx-i18n="app.appTitle">Reisekosten</h1>
      <p class="rk-subtitle" data-qrx-i18n="app.appSubtitle">Reisekosten nach deutschen Regeln — automatisch berechnet.</p>
    </div>
    <div class="rk-topbar-actions">
      <button class="qrx-btn qrx-btn-ghost rk-nav-settings" type="button" data-qrx-i18n="app.settings">Einstellungen</button>
      <button class="qrx-btn rk-nav-expense" type="button" data-qrx-i18n="app.newExpense">+ Ausgabe</button>
      <button class="qrx-btn qrx-btn-primary rk-nav-new" type="button" data-qrx-i18n="app.newTrip">+ Neue Reise</button>
    </div>
  </div>

  <!-- Ansicht: Reise-Liste (Startansicht) -->
  <section id="rk-view-list" class="rk-view"></section>

  <!-- Ansicht: Reise bearbeiten -->
  <section id="rk-view-edit" class="rk-view" hidden></section>

  <!-- Ansicht: Einstellungen -->
  <section id="rk-view-settings" class="rk-view" hidden></section>

  <!-- Ansicht: Druckbare Abrechnung -->
  <section id="rk-view-report" class="rk-view" hidden></section>

</div>
